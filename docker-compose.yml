services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?isi dulu di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi dulu di .env}
      POSTGRES_DB: postgres # DB maintenance saja, DB aplikasi dibuat Odoo
      ODOO_DB_NAME: ${ODOO_DB_NAME:-odoo_app} # dibaca skrip backup/restore di dalam container
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      retries: 10

  web:
    image: odoo:17
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:?isi dulu di .env}
      PASSWORD: ${POSTGRES_PASSWORD:?isi dulu di .env}
    volumes:
      - ./config:/etc/odoo
      - ./custom_addons:/mnt/extras-addons
      - odoo-web-data:/var/lib/odoo
    command: odoo -d ${ODOO_DB_NAME:-odoo_app} --without-demo=all --dev=reload,xml

volumes:
  odoo-web-data:
    name: odoo-web-data
  odoo-db-data:
    name: odoo-db-data
